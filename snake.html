<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>SNEK — Retro Snake</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0a0f;
      --panel:   #12121a;
      --border:  #2a2a3d;
      --accent:  #00ff88;
      --accent2: #ff3864;
      --accent3: #ffe156;
      --text:    #e0e0f0;
      --dim:     #555577;
      --glow:    0 0 12px #00ff8866, 0 0 30px #00ff8833;
      --glow-r:  0 0 12px #ff386466, 0 0 30px #ff386433;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 8px 24px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
      pointer-events: none;
      z-index: 500;
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 480px;
    }

    .logo {
      font-size: clamp(18px, 5vw, 30px);
      color: var(--accent);
      text-shadow: var(--glow);
      letter-spacing: 6px;
      text-align: center;
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { text-shadow: var(--glow); }
      50%      { text-shadow: 0 0 24px #00ff88cc, 0 0 60px #00ff8866; }
    }
    .tagline {
      font-family: 'VT323', monospace;
      font-size: clamp(14px, 4vw, 18px);
      color: var(--dim);
      letter-spacing: 3px;
      margin-top: 4px;
      text-align: center;
    }

    /* HUD */
    #hud {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: center;
      flex: 1;
    }
    .hud-label { color: var(--dim); font-size: 7px; margin-bottom: 4px; }
    .hud-val   { color: var(--accent); font-size: clamp(10px, 3vw, 14px); text-shadow: var(--glow); }
    #high-val  { color: var(--accent3); text-shadow: 0 0 10px #ffe15688; }

    /* Canvas */
    #canvas-wrap {
      width: 100%;
      position: relative;
      border: 2px solid var(--border);
      box-shadow: 0 0 0 1px #00ff8822, 0 0 40px #00ff8811;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      touch-action: none;
    }

    /* Pause banner inside canvas */
    #pause-banner {
      display: none;
      position: absolute; inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(10,10,15,0.75);
      font-size: clamp(14px, 4vw, 22px);
      color: var(--accent3);
      text-shadow: 0 0 12px #ffe15688;
      letter-spacing: 4px;
      z-index: 5;
      pointer-events: none;
    }
    #pause-banner.show { display: flex; }

    /* ── Full-screen modal overlays (outside canvas) ── */
    .modal {
      display: none;
      position: fixed; inset: 0;
      z-index: 100;
      background: rgba(10,10,15,0.96);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
    }
    .modal.show { display: flex; }

    .modal-title {
      font-size: clamp(16px, 5vw, 26px);
      color: var(--accent);
      text-shadow: var(--glow);
      text-align: center;
      line-height: 1.8;
    }
    .modal-title.red { color: var(--accent2); text-shadow: var(--glow-r); }
    .modal-sub {
      font-family: 'VT323', monospace;
      font-size: clamp(18px, 5vw, 24px);
      color: var(--dim);
      text-align: center;
      line-height: 1.6;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 3vw, 13px);
      color: var(--bg);
      background: var(--accent);
      border: none;
      padding: 16px 28px;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 0 5px 0 #007744, var(--glow);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #007744; }

    /* D-pad */
    #dpad-area {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: min(220px, 62vw);
      height: min(220px, 62vw);
    }

    .dpad-btn {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 8px;
      color: var(--accent);
      font-size: clamp(20px, 6vw, 30px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dpad-btn:active, .dpad-btn.pressed {
      background: #1e2e22;
      border-color: var(--accent);
      transform: scale(0.90);
    }
    .dpad-center {
      background: #0d0d18;
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(6px, 2vw, 9px);
      color: var(--dim);
      cursor: pointer;
      letter-spacing: 1px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .dpad-center:active { background: #1a1a2a; }

    #dpad-up    { grid-column:2; grid-row:1; }
    #dpad-left  { grid-column:1; grid-row:2; }
    #dpad-pause { grid-column:2; grid-row:2; }
    #dpad-right { grid-column:3; grid-row:2; }
    #dpad-down  { grid-column:2; grid-row:3; }

    /* hide keyboard hint on touch devices */
    #kb-hint { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    @media (pointer: coarse) { #kb-hint { display: none; } }
    .key-hint { font-family:'VT323',monospace; font-size:15px; color:var(--dim); display:flex; align-items:center; gap:5px; }
    .key { background:var(--panel); border:1px solid var(--border); padding:2px 6px; font-size:13px; color:var(--text); }
  </style>
</head>
<body>

<!-- START MODAL -->
<div class="modal show" id="start-modal">
  <div class="modal-title">◀ SNEK ▶</div>
  <div class="modal-sub">EAT · GROW · SURVIVE<br><br>SWIPE OR USE D-PAD<br>TO CONTROL</div>
  <button class="btn" id="start-btn">▶ START GAME</button>
</div>

<!-- GAME OVER MODAL -->
<div class="modal" id="gameover-modal">
  <div class="modal-title red" id="go-title">GAME OVER</div>
  <div class="modal-sub" id="go-sub">SCORE: 0</div>
  <button class="btn" id="restart-btn">↺ PLAY AGAIN</button>
</div>

<!-- GAME UI -->
<div id="wrapper">
  <header style="text-align:center">
    <div class="logo">◀ SNEK ▶</div>
    <div class="tagline">EAT · GROW · SURVIVE</div>
  </header>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-val" id="score-val">0</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">LEVEL</div>
      <div class="hud-val" id="level-val">1</div>
    </div>
    <div class="hud-box">
      <div class="hud-label">BEST</div>
      <div class="hud-val" id="high-val">0</div>
    </div>
  </div>

  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div id="pause-banner">⏸ PAUSED</div>
  </div>

  <div id="kb-hint">
    <span class="key-hint"><span class="key">↑↓←→</span> or <span class="key">WASD</span> move</span>
    <span class="key-hint"><span class="key">P</span> pause</span>
  </div>

  <div id="dpad-area">
    <button class="dpad-btn" id="dpad-up">▲</button>
    <button class="dpad-btn" id="dpad-left">◀</button>
    <div class="dpad-center" id="dpad-pause">PAUSE</div>
    <button class="dpad-btn" id="dpad-right">▶</button>
    <button class="dpad-btn" id="dpad-down">▼</button>
  </div>
</div>

<script>
(function () {
  var canvas  = document.getElementById('c');
  var ctx     = canvas.getContext('2d');
  var COLS = 20, ROWS = 20, CELL = 20;

  function resize() {
    var w = Math.min(document.getElementById('canvas-wrap').offsetWidth, 480);
    CELL = Math.floor(w / COLS);
    canvas.width  = COLS * CELL;
    canvas.height = ROWS * CELL;
    if (alive) draw(); else drawIdle();
  }
  window.addEventListener('resize', resize);

  var snake, dir, nextDir, food, score, level, speed, tid, paused, alive;
  var hiScore = +(localStorage.getItem('snekHi') || 0);
  document.getElementById('high-val').textContent = hiScore;

  function rand(n) { return Math.floor(Math.random() * n); }

  function spawnFood() {
    var occ = {};
    snake.forEach(function(s){ occ[s.x+','+s.y] = 1; });
    var f;
    do { f = {x:rand(COLS), y:rand(ROWS)}; } while (occ[f.x+','+f.y]);
    food = f;
  }

  function init() {
    var mx = Math.floor(COLS/2), my = Math.floor(ROWS/2);
    snake   = [{x:mx,y:my},{x:mx-1,y:my},{x:mx-2,y:my}];
    dir     = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0; level = 1; speed = 150;
    paused = false; alive = true;
    spawnFood(); hud();
  }

  function hud() {
    document.getElementById('score-val').textContent = score;
    document.getElementById('level-val').textContent = level;
    document.getElementById('high-val').textContent  = hiScore;
  }

  function tick() {
    if (!alive || paused) return;
    dir = {x:nextDir.x, y:nextDir.y};
    var h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if (h.x<0||h.x>=COLS||h.y<0||h.y>=ROWS) { die(); return; }
    for (var i=0;i<snake.length;i++) {
      if (snake[i].x===h.x && snake[i].y===h.y) { die(); return; }
    }
    snake.unshift(h);
    if (h.x===food.x && h.y===food.y) {
      score += 10*level;
      if (score>hiScore) { hiScore=score; localStorage.setItem('snekHi',hiScore); }
      var nl = Math.floor(score/50)+1;
      if (nl>level) { level=nl; speed=Math.max(55,150-(level-1)*15); loop(); }
      spawnFood(); hud();
    } else { snake.pop(); }
    draw();
  }

  function loop() { clearInterval(tid); tid = setInterval(tick, speed); }

  function die() {
    alive = false; clearInterval(tid);
    document.getElementById('go-title').textContent = 'GAME OVER';
    document.getElementById('go-sub').textContent   = 'SCORE: '+score+'   BEST: '+hiScore;
    document.getElementById('gameover-modal').classList.add('show');
    drawDead();
  }

  /* drawing */
  function cell(x, y, color, glow) {
    if (glow) { ctx.shadowColor=color; ctx.shadowBlur=12; }
    ctx.fillStyle = color;
    ctx.fillRect(x*CELL+1, y*CELL+1, CELL-2, CELL-2);
    ctx.shadowBlur = 0;
  }

  function drawIdle() {
    ctx.fillStyle='#0a0a0f'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#1a1a28';
    for(var x=0;x<COLS;x++) for(var y=0;y<ROWS;y++)
      ctx.fillRect(x*CELL+CELL/2-1,y*CELL+CELL/2-1,2,2);
  }

  function draw() {
    drawIdle();
    var blink = Math.floor(Date.now()/220)%2;
    cell(food.x,food.y, blink?'#ff3864':'#ff6b8a', true);
    ctx.fillStyle='#ffaaaa';
    var fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2, r=Math.floor(CELL*0.3);
    ctx.fillRect(fx-1,fy-r,2,r*2); ctx.fillRect(fx-r,fy-1,r*2,2);

    for(var i=0;i<snake.length;i++){
      var s=snake[i];
      var c=i===0?'#00ff88':'hsl('+(150-i*2)+',80%,'+Math.max(25,50-i*0.8)+'%)';
      cell(s.x,s.y,c,i===0);
      if(i===0){
        ctx.fillStyle='#0a0a0f';
        var ex=s.x*CELL,ey=s.y*CELL,e=Math.max(2,Math.floor(CELL*0.15));
        var o=dir.x===1?[[CELL*.62,CELL*.24],[CELL*.62,CELL*.62]]
             :dir.x===-1?[[CELL*.18,CELL*.24],[CELL*.18,CELL*.62]]
             :dir.y===-1?[[CELL*.24,CELL*.18],[CELL*.62,CELL*.18]]
             :           [[CELL*.24,CELL*.62],[CELL*.62,CELL*.62]];
        o.forEach(function(p){ctx.fillRect(ex+p[0],ey+p[1],e,e);});
      }
    }
  }

  function drawDead() {
    ctx.fillStyle='rgba(255,56,100,0.18)'; ctx.fillRect(0,0,canvas.width,canvas.height);
    snake.forEach(function(s){cell(s.x,s.y,'#ff3864',true);});
  }

  /* start / restart */
  function startGame() {
    document.getElementById('start-modal').classList.remove('show');
    document.getElementById('gameover-modal').classList.remove('show');
    document.getElementById('pause-banner').classList.remove('show');
    init(); resize(); draw(); loop();
  }

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('restart-btn').addEventListener('click', startGame);

  /* pause */
  function togglePause() {
    if (!alive) return;
    paused = !paused;
    if (paused) { clearInterval(tid); document.getElementById('pause-banner').classList.add('show'); }
    else { document.getElementById('pause-banner').classList.remove('show'); loop(); }
  }

  /* direction */
  function go(d) {
    if (!alive || paused) return;
    if (d.x===-dir.x && d.y===-dir.y) return;
    nextDir = d;
  }

  /* keyboard */
  document.addEventListener('keydown', function(e){
    if (e.key==='p'||e.key==='P') { togglePause(); return; }
    var m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
           w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
           W:{x:0,y:-1},S:{x:0,y:1},A:{x:-1,y:0},D:{x:1,y:0}};
    if (m[e.key]) { e.preventDefault(); go(m[e.key]); }
  });

  /* d-pad */
  function bind(id, d) {
    var b = document.getElementById(id);
    b.addEventListener('touchstart', function(e){ e.preventDefault(); go(d); b.classList.add('pressed'); }, {passive:false});
    b.addEventListener('touchend',   function(e){ e.preventDefault(); b.classList.remove('pressed'); },    {passive:false});
    b.addEventListener('click', function(){ go(d); });
  }
  bind('dpad-up',    {x:0,y:-1});
  bind('dpad-down',  {x:0,y:1});
  bind('dpad-left',  {x:-1,y:0});
  bind('dpad-right', {x:1,y:0});
  var pb=document.getElementById('dpad-pause');
  pb.addEventListener('touchstart',function(e){e.preventDefault();togglePause();},{passive:false});
  pb.addEventListener('click',togglePause);

  /* swipe on canvas */
  var sx=0,sy=0;
  canvas.addEventListener('touchstart',function(e){e.preventDefault();sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:false});
  canvas.addEventListener('touchend',function(e){
    e.preventDefault();
    var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)<10&&Math.abs(dy)<10) return;
    Math.abs(dx)>Math.abs(dy) ? go(dx>0?{x:1,y:0}:{x:-1,y:0}) : go(dy>0?{x:0,y:1}:{x:0,y:-1});
  },{passive:false});

  /* init */
  resize();
  drawIdle();
})();
</script>
</body>
</html>
